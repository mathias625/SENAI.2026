<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locadora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar" style="background-color: var(--bs-danger);" data-bs-theme="dark">
        <div class="container">
            <a class="navbar-brand" href="#">Locadora</a>
            <div class="navbar-nav">
                <a class="nav-link active" href="#">Home</a>
                <a class="nav-link active" href="#">Filmes</a>
            </div>
        </div>
    </nav>

    <header class="bg-dark text-white text-center py-5 mb-4">
        <div class="container">
            <h1 class="fw-light">Os melhores filmes!</h1>
        </div>
    </header>

    <div class="container">
        <div class="row">

            <div class="col-12 col-md-4 mb-4">
                <div class="card shadow-sm">
                    <img src="re.jpg" alt="Filme">
                    <div class="card-body text-center">
                        <h5 class="card-title">Resident Evil 4</h5>
                        <p class="card-text">R$ 10,00</p>
                        <a href="#" class="btn w-100" style="background: var(--bs-danger); color: white;">
                            Alugar
                        </a>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-4 mb-4">
                <div class="card shadow-sm">
                    <img src="lether.jpg" alt="Filme">
                    <div class="card-body text-center">
                        <h5 class="card-title">The Texas Chain Saw Massacre 2</h5>
                        <p class="card-text">R$ 12,00</p>
                        <a href="#" class="btn w-100" style="background: var(--bs-danger); color: white;">
                            Alugar
                        </a>
                    </div>
                </div>
            </div>

        </div>
    </div>



</body>
</html>
